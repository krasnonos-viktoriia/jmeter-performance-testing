name: JMeter Status Codes Tests

on:
  push:
    branches:
      - main

jobs:
  jmeter-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JMeter
        run: |
          wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Run Basic Status Codes Test
        run: |
          mkdir -p results reports/status_codes_report
          ./jmeter/bin/jmeter -n \
            -t test-plans/status_codes_test.jmx \
            -l results/status_codes_results.jtl \
            -e \
            -o reports/status_codes_report

      - name: Run Load Test
        run: |
          mkdir -p reports/status_load_report
          ./jmeter/bin/jmeter -n \
            -t test-plans/status_load_test.jmx \
            -l results/status_load.jtl \
            -e \
            -o reports/status_load_report

      - name: Run Stress Test
        run: |
          mkdir -p reports/status_stress_report
          ./jmeter/bin/jmeter -n \
            -t test-plans/status_stress_test.jmx \
            -l results/status_stress.jtl \
            -e \
            -o reports/status_stress_report

      - name: Run Endurance Test
        run: |
          mkdir -p reports/status_endurance_report
          ./jmeter/bin/jmeter -n \
            -t test-plans/status_endurance_test.jmx \
            -l results/status_endurance.jtl \
            -e \
            -o reports/status_endurance_report

      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-status-codes-html-reports
          path: reports